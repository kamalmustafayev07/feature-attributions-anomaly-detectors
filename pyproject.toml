[project]
name = "opssat-xai"
version = "0.1.0"
description = "Faithfulness and Stability of Feature Attributions for Lightweight Spacecraft Telemetry Anomaly Detectors (OPSSAT-AD)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
  "scikit-learn==1.9.0",
  "shap>=0.50,<0.55",
  "torch>=2.5",
  "matplotlib>=3.9",
  "pyyaml>=6",
  "joblib>=1.4",
  "psutil>=6",
  "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opssat_xai"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
